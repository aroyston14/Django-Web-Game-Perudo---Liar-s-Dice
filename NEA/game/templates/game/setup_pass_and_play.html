<!DOCTYPE html>
<html>
<head>
    <title>Pass and Play Setup</title>
    <!-- Here are the css style tags for this page-->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background-color: white;
            padding: 30px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            width: 400px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: inline-block;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .form-group select {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 15px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 4px;
            background-color: white;
            border: 1px solid #ccc;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background-color: #f4f4f4;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pass and Play</h1>
        <form method="post">
            <!-- Using django to prevent against csrf attacks-->
            {% csrf_token %}
            <!-- Setting up the form for initial dice choicse, only allowing valid inputs-->
            <div class="form-group">
                <label for="initial_dice">Please Select Number of Initial Dice:</label>
                <select id="initial_dice" name="initial_dice" required>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="5">6</option>
                    
                </select>
            </div>
            <!-- Setting up the form for initial number of players, only allowing a reasonable number of players, given the space on the screen-->
            <div class="form-group">
                <label for="num_players">Please Select Number of Players:</label>
                <select id="num_players" name="num_players" required>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select>
            </div>

            <!-- Allowing user to start game -->
            <button type="submit">Start Game</button>
        </form>
    </div>
</body>
</html>
