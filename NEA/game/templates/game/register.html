<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <!-- Setting out the css style tags for this page-->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 500px;
            padding: 20px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

    


        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 95%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- Setting up the cancel button -->
            <form action="{% url 'home' %}" method="get" style="margin: 0;">
                <button type="submit" class="cancel">Cancel</button>
            </form>
            
            <!-- Setting the register button to submit the form -->
            <button type="submit" form="registerForm" class="submit">Register</button>
        </div>
        <!-- Display any error messages if there are any-->
        {% if messages %}
            <div class="error-message">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
        <!-- Setting up the form for the user to enter their registration details-->
        <form id="registerForm" method="post">
            <!-- Using django to prevent against csrf attacks-->
            {% csrf_token %}
            <label for="email">Email</label>
            <input type="text" id="email" name="email" required>

            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </form>
    </div>
</body>
